# Reviewed Task 1.3; provenance and dependency rationale: package-review.json
package: base-passwd
essential:
  - base-passwd_copyright
slices:
  data:
    contents:
      /etc/group:
        text: FIXME
        mutable: true
      /etc/passwd:
        text: FIXME
        mutable: true
      /usr/share/base-passwd/group.master:
        until: mutate
      /usr/share/base-passwd/passwd.master:
        until: mutate
    mutate: |
      gr = content.read("/usr/share/base-passwd/group.master")
      content.write("/etc/group", gr)
      pw = content.read("/usr/share/base-passwd/passwd.master")
      content.write("/etc/passwd", pw)

      pw = content.read("/etc/passwd")
      content.write("/etc/passwd", pw + "docker:x:10000:50:Snipe-IT:/home/docker:/usr/sbin/nologin\n")
  copyright:
    contents:
      /usr/share/doc/base-passwd/copyright: null
