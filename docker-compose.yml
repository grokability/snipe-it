# Compose file for production.

volumes:
  db_data:
  storage:
  backup_data:

services:
  app:
    image: snipe/snipe-it:${APP_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
  
  backup:
    image: fradelg/mysql-cron-backup
    restart: unless-stopped
    volumes:
      - backup_data:/backup
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASS: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      CRON_TIME: "0 2 * * *"              # Backtup every day at 2 AM
      BACKUP_RETAIN_DAYS: 30              # Store backups for 30 days
      INIT_BACKUP: "1"                    # Start with an initial backup
      GZIP_LEVEL: "9"                     # Maximum compression
    depends_on:
      db:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: snipeit-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 5
